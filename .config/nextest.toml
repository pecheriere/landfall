# A hung test fails instead of stalling the run: nextest has no limit by default.
# About 3 times the slowest normal test (about 3 s), with a floor of 30 s.
[profile.default]
slow-timeout = { period = "10s", terminate-after = 3 }

# Real-Docker and live tests pull images, wait out check windows and start real
# binaries; the slowest takes about 80 s.
[[profile.default.overrides]]
filter = "test(docker_) | test(live_)"
slow-timeout = { period = "60s", terminate-after = 3 }
