name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow reruns the whole CI on the tagged commit before it
  # publishes anything.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Plain `cargo test` has no time limit of its own.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      # The software authenticator signs whatever it is told to. Only dev-dependencies may
      # enable it, and the normal and build edges are what a release binary is made of.
      - name: No release binary has test-support
        shell: bash
        run: |
          cargo tree --workspace --locked --target all -e normal,build,features > "$RUNNER_TEMP/tree.txt"
          grep -q landfall-approval "$RUNNER_TEMP/tree.txt"
          if grep -F 'feature "test-support"' "$RUNNER_TEMP/tree.txt"; then
            exit 1
          fi
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Docker driver and deploy engine against the real Docker
        run: cargo test -p landfall-agent --all-features --locked -- --ignored docker
      # Built as the runner's user, so nothing in target/ ends up root's; only
      # the test binaries run as root. Without root these tests skip, which
      # LANDFALL_TEST_REQUIRE_ROOT turns into a failure, and a filter matching
      # nothing would pass, hence the count: one binary with safefs's, one with
      # the end-to-end test.
      - name: Foreign-owner tests as root
        shell: bash
        env:
          LANDFALL_TEST_REQUIRE_ROOT: "1"
        run: |
          cargo test -p landfall-agent --all-features --locked \
            --config "target.'cfg(unix)'.runner = ['sudo', '-E']" \
            -- --include-ignored foreign_owner | tee "$RUNNER_TEMP/foreign-owner.txt"
          test "$(grep -Ec '^test result: ok\. [1-9]' "$RUNNER_TEMP/foreign-owner.txt")" = 2
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check

  crate-age:
    # Compares Cargo.lock with the PR's base, so it only runs on pull requests.
    # Nothing stops a push straight to main from skipping it, so a release
    # workflow must run the same check against the previous release tag before
    # it publishes anything (release.yml does).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # About 5 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
          persist-credentials: false
      - name: Lint and test the CI scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r .github/requirements-lint.txt
          "$RUNNER_TEMP/lint/bin/ruff" check .github/scripts
          "$RUNNER_TEMP/lint/bin/ruff" format --check .github/scripts
          python3 -I -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Refuse crate versions published less than 7 days ago
        run: python3 -I .github/scripts/crate_age.py --base HEAD^1

  docker-build:
    runs-on: ubuntu-latest
    # Runs what a pull request built, so one that hangs mustn't hold this for 6 hours. About
    # three times the slowest recent run, leaving room for a cold build of all three.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The same reference as .github/buildkit/Dockerfile, which a test checks.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
          cache-binary: false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Both platforms the image supports. The builder stage
          # cross-compiles with zig and the final stage only copies files, so
          # no emulation is needed.
          platforms: linux/arm64,linux/amd64
          push: false
          # Pull requests and main share one build cache. The release workflow's
          # publish job never reads it, so a cache entry cannot reach a
          # published image.
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build
      # The same builder stage as the image, so this adds little once that has run.
      - name: Build the static binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binaries
          platforms: linux/arm64,linux/amd64
          outputs: type=local,dest=dist
          provenance: false
          sbom: false
          push: false
          cache-from: type=gha,scope=docker-build
      - name: Check the static binaries
        run: python3 -I .github/scripts/check_binaries.py dist
      - name: Run the static binaries
        run: |
          dist/linux_amd64/landfall --version
          dist/linux_amd64/landfall-agent --version
      # The header check can't see bad relocations or a failure at start-up, and nothing else
      # runs these. The image the builder runs in, pinned and already pulled, holds a QEMU. This
      # is a start, not a real kernel: it has no ASLR to show, and no 16 KiB pages. A file whose
      # code is broken can hang under it rather than fail, hence the limit.
      - name: Run the arm64 binaries under QEMU
        env:
          # The same reference as .github/buildkit/Dockerfile, which a test checks.
          BUILDKIT: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
        run: |
          for binary in landfall landfall-agent; do
            timeout --kill-after=10 60 docker run --rm --init --entrypoint /usr/bin/buildkit-qemu-aarch64 \
              -v "$PWD/dist/linux_arm64:/d:ro" "$BUILDKIT" "/d/$binary" --version
          done
