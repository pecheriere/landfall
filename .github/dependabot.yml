version: 2

# Version updates wait until a release is 7 days old, the age the crate-age
# check and the action pinning rule require, and minor and patch updates come
# grouped into one pull request per ecosystem. Security updates skip the
# cooldown; a crate release younger than 7 days that fixes an advisory still
# needs an entry in .github/crate-age-allow.toml.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # The hash-pinned ruff the crate-age job installs.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # Playwright, for the browser test of the web pages.
  - package-ecosystem: npm
    directory: /crates/server/tests/browser
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # The digest-pinned Rust base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: build

  # The digest-pinned Debian of the image that `host install` is tested in.
  - package-ecosystem: docker
    directory: /crates/cli/tests/docker_host_install
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-host-install:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: test

  # The BuildKit that CI and the release build in. The file is only Dependabot's
  # copy of the pin: its pull request fails test_buildkit_pin.py until the same
  # reference goes in the workflows. On its own, so that this can't hold up a
  # Rust base image update.
  - package-ecosystem: docker
    directory: /.github/buildkit
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      buildkit:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: ci
