[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/agent", "crates/cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pecheriere/landfall"

# Release binaries ship without symbols. Set here, not per build, so the
# Dockerfile's dependency layer and final build share one profile.
[profile.release]
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
landfall-core = { path = "crates/core" }
clap = { version = "4.6.7", features = ["derive"] }
semver = "1.0.28"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "0.9.8"
