[workspace]
resolver = "3"
members = ["crates/core", "crates/origin", "crates/server", "crates/agent", "crates/cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pecheriere/landfall"

# Release binaries ship without symbols. Set here, not per build, so the
# Dockerfile's dependency layer and final build share one profile.
[profile.release]
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
landfall-core = { path = "crates/core", version = "0.0.0" }
landfall-origin = { path = "crates/origin", version = "0.0.0" }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
semver = { version = "1.0.28", features = ["serde"] }
sha2 = "0.11.1"
# Agent request signatures: sign and verify only. Keys are supplied by the
# caller, so no randomness feature is enabled here.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "0.9.8"
serde_json = "1.0.154"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519"] }
# Sigstore bundle verification. Only the aws-lc-rs crypto backend: no TUF
# client with rustls (no openssl, no native-tls) for the trust root.
sigstore-verify = { version = "0.15.1", default-features = false, features = ["aws-lc-rs", "rustls", "tuf"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false }
# Linear-time substring search for the agent's log scan.
memchr = "2.8.3"
base64 = "0.23.1"
# HTTP for the GitHub and registry fetchers: the version and TLS stack the
# Sigstore TUF client already uses (rustls with aws-lc-rs).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Git object ids (GitHub repositories are SHA-1), with collision detection.
# 0.11 is a release candidate.
sha1-checked = { version = "0.10.0", default-features = false }
wiremock = "0.6.5"
# Process identity (uid) and no-follow directory-fd walking without unsafe code.
rustix = { version = "1.1.5", default-features = false, features = ["std", "process", "fs"] }
# The controller's store. Queries are plain SQL with bound parameters: no
# `macros` feature, so nothing about the schema is checked or embedded at build
# time beyond the migration text itself.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5.3", default-features = false }
# The controller's own accept loop: `axum::serve` has no way to set a timeout on
# reading a request's headers, so a client could hold a connection forever. Both
# are already in the tree through axum.
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
http-body-util = "0.1.5"
# Test bodies that stream or stall. Already in the tree through tokio and axum.
futures-core = { version = "0.3.34", default-features = false }
# Enrolment codes. The operating system's generator, nothing seeded.
getrandom = "0.4.3"
hex = "0.4.3"
