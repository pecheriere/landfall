[package]
name = "landfall-cli"
description = "Command-line client for the landfall API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "landfall"
path = "src/main.rs"

[dependencies]
clap.workspace = true
getrandom.workspace = true
# Times from the controller, printed in UTC as RFC 3339.
jiff.workspace = true
landfall-api.workspace = true
landfall-approval.workspace = true
landfall-core.workspace = true
landfall-origin.workspace = true
# The controller's API. rustls only, as the workspace sets it.
reqwest.workspace = true
# The token file, opened with no-follow and checked by its descriptor, without unsafe code.
rustix.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
toml.workspace = true

[dev-dependencies]
base64.workspace = true
# Mock servers over plain http and a snapshot trust root, for the first release's
# fixture verified offline.
landfall-origin = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock.workspace = true

[lints]
workspace = true
