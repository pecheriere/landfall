[package]
name = "landfall-server"
description = "Watches releases, verifies their origin and coordinates deploys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "landfall-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
getrandom.workspace = true
hex.workspace = true
landfall-core.workspace = true
landfall-origin.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
