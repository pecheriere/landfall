[package]
name = "landfall-server"
description = "Watches releases, verifies their origin and coordinates deploys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "landfall-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
landfall-approval.workspace = true
landfall-core.workspace = true
landfall-origin.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { workspace = true, features = ["util"] }

[dev-dependencies]
futures-core.workspace = true
jiff.workspace = true
# The software authenticator. For tests only, as a dev-dependency.
landfall-approval = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
