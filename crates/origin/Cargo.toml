[package]
name = "landfall-origin"
description = "Release origin verification for landfall: Sigstore bundles, Fulcio identities, trust roots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Plain-http endpoints and a trust root from a snapshot, for another crate's tests
# against mock servers. For tests only: a dev-dependency may enable this, a normal
# dependency never.
test-support = []

[dependencies]
futures-util.workspace = true
jiff.workspace = true
landfall-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1-checked.workspace = true
sha2.workspace = true
sigstore-verify.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
base64.workspace = true
landfall-approval.workspace = true
# Signing a tag in a test, over a commit the test chooses: the library the
# verifier already uses, through landfall-core.
ssh-key.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
wiremock.workspace = true

[lints]
workspace = true
