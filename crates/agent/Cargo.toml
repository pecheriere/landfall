[package]
name = "landfall-agent"
description = "Runs on each host: verifies and deploys releases, checks health, rolls back."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "landfall-agent"
path = "src/main.rs"

[dependencies]
clap.workspace = true
jiff.workspace = true
landfall-core.workspace = true
landfall-origin.workspace = true
memchr.workspace = true
rustix.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
