[package]
name = "landfall-agent"
description = "Runs on each host: verifies and deploys releases, checks health, rolls back."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "landfall-agent"
path = "src/main.rs"

[dependencies]
clap.workspace = true
getrandom.workspace = true
hex.workspace = true
jiff.workspace = true
landfall-approval.workspace = true
landfall-core.workspace = true
landfall-origin.workspace = true
memchr.workspace = true
reqwest.workspace = true
rustix.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }

[dev-dependencies]
base64.workspace = true
# Holds private keys in memory and signs what it is told to: a dev-dependency only.
# CI refuses a release dependency tree that has this feature on.
landfall-approval = { workspace = true, features = ["test-support"] }
# The end-to-end tests run the controller too. Only in this direction: the server
# depends on nothing of the agent's.
landfall-server.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }
wiremock.workspace = true

[lints]
workspace = true
